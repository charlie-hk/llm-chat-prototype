services:
  - type: web
    name: llm-chat-prototype
    runtime: docker
    plan: free
    envVars:
      - key: PROVIDER
        value: gemini
      - key: MODEL
        value: "gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-flash-latest"
      - key: API_KEY
        sync: false
